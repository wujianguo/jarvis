edition: 3.0.0
name: jarvis-nestjs
access: default

resources:
  jarvis:
    component: fc3
    actions:
      pre-deploy:
        - run: npm ci
        - run: npm run build
        - run: npm ci --omit=dev
        - run: npm cache clean --force
        - run: wget http://mirrors.nju.edu.cn/nodejs-release/v22.16.0/node-v22.16.0-linux-x64.tar.gz -O node-v22.16.0-linux-x64.tar.gz && tar -zxvf node-v22.16.0-linux-x64.tar.gz && rm -rf node-v22.16.0-linux-x64.tar.gz
    props:
      region: 'cn-shanghai'
      code: '.'
      memorySize: 256
      cpu: 0.25
      timeout: 600
      functionName: jarvis-nestjs
      customRuntimeConfig:
        command:
          - ./node-v22.16.0-linux-x64/bin/node
          - dist/main
      triggers:
        - triggerName: defaultTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
      environmentVariables:
        KV_BASE_URL: ${env('KV_BASE_URL')}
        KV_API_TOKEN: ${env('KV_API_TOKEN')}
        FEISHU_BITABLE_DATABASES_JSON: ${env('FEISHU_BITABLE_DATABASES_JSON')}
        FEISHU_APP_ID: ${env('FEISHU_APP_ID')}
        FEISHU_APP_SECRET: ${env('FEISHU_APP_SECRET')}
        FEISHU_VERIFICATION_TOKEN: ${env('FEISHU_VERIFICATION_TOKEN')}
        FEISHU_SHEETS_EXPORT_SPREADSHEET_TOKEN: ${env('FEISHU_SHEETS_EXPORT_SPREADSHEET_TOKEN')}
        FEISHU_SHEETS_EXPORT_SHEET_ID: ${env('FEISHU_SHEETS_EXPORT_SHEET_ID')}
        CLOUDFLARE_ACCOUNT_ID: ${env('CLOUDFLARE_ACCOUNT_ID')}
        GATEWAY_NAME: ${env('GATEWAY_NAME')}
        CF_AIG_TOKEN: ${env('CF_AIG_TOKEN')}
